
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartwatchlist
      POSTGRES_PASSWORD: smartwatchlist
      POSTGRES_DB: smart_market_watchlist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwatchlist -d smart_market_watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
