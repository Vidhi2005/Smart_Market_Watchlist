
services:
  db:
    image: postgres:16-alpine
    # POSTGRES_PASSWORD below is a trivial local-dev credential — this
    # compose file is for local development only. If Postgres is ever run
    # via this file (or a copy of it) anywhere publicly reachable, override
    # the password with a real deployment-specific secret first.
    environment:
      POSTGRES_USER: smartwatchlist
      POSTGRES_PASSWORD: smartwatchlist
      POSTGRES_DB: smart_market_watchlist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwatchlist -d smart_market_watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
